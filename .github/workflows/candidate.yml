# AI-Assisted: Claude Code (model: claude-sonnet-5) - Authored the candidate workflow (task
# T109-T110): workflow_dispatch plus called by detect.yml on exit 10, running the full build,
# pushing candidate/<rulesVersionId>, and opening or updating a PR carrying the curated diff and
# every report -- with no permission that can reach Releases or Pages, so FR-052 is enforced by
# capability rather than by policy, plus the supersession concurrency group (FR-057).
# AI-Assisted: Claude Code (model: claude-sonnet-5) - Wired the candidate reviewer view (task
# T119): the PR body now assembles the verdict, the scale table, and every sub-report in the
# approver's reading order via tools/render_pr_body.py, rather than a one-line pointer (FR-037).
name: candidate

# Two ways in: a curator dispatching it directly (FR-056's manual path, independent of detection
# state) and `detect.yml` calling it as a reusable workflow on exit 10. Neither is `schedule` and
# neither is `push` -- the only thing this workflow ever does is build a reviewable candidate.
on:
  workflow_dispatch:
    inputs:
      rules_version_id:
        description: The rulesVersionId this candidate will carry, e.g. mfm-2026-06
        required: true
        type: string
  workflow_call:
    inputs:
      rules_version_id:
        required: true
        type: string

# A newer candidate explicitly supersedes an older one for the SAME version id (FR-057, research
# D7) -- a manual re-run and a scheduled detection for the same release cannot both land.
concurrency:
  group: candidate-${{ inputs.rules_version_id }}
  cancel-in-progress: true

# `contents: write` pushes the candidate branch; `pull-requests: write` opens or updates its PR.
# Nothing here can create a Release, upload an asset, or deploy Pages -- compare `publish.yml`'s
# `pages: write` and `id-token: write`, which this workflow deliberately does not have. FR-052 is
# therefore enforced by what this token *can* do, not by a check that it did not.
permissions:
  contents: write
  pull-requests: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      RULES_VERSION_ID: ${{ inputs.rules_version_id }}
      # The keyed ability mechanic digest (contract pipeline-run-interface §5, 1.0.1) is part
      # of every full build; without the key the build refuses with DigestKeyMissingError.
      WGC_MECHANIC_DIGEST_KEY: ${{ secrets.WGC_MECHANIC_DIGEST_KEY }}
      # Where the detail-source CSV export lives (empty default refuses live acquisition);
      # a repository variable so a curator can repoint it without a workflow change.
      WGC_DETAIL_SOURCE_URL: ${{ vars.WGC_DETAIL_SOURCE_URL }}
      # The build-shaping variables the byte-identical rebuild depends on, all repository
      # variables for the same reason WGC_DETAIL_SOURCE_URL is one: they describe *this data
      # set's* current release posture, not the pipeline's behaviour, and a curator must be able
      # to change them without a workflow edit. They are deliberately NOT library defaults --
      # a default reaches every fixture build in the test suite, where an un-curated fixture is
      # the expected state and a switched-on gate would block it.
      #
      # WGC_DETAIL_ACQUISITION_MODE / WGC_DETAIL_EDITION: html + wh40k-11e is the wholesale
      # adoption the O1 Ruling requires (004 T074). Absent these, a CI rebuild would acquire in
      # csv mode against wh40k-10e and could not reproduce a candidate built in html mode.
      # WGC_GATE_*: on, the three campaigns having completed (004 T050, T057, T064).
      WGC_DETAIL_ACQUISITION_MODE: ${{ vars.WGC_DETAIL_ACQUISITION_MODE }}
      WGC_DETAIL_EDITION: ${{ vars.WGC_DETAIL_EDITION }}
      WGC_GATE_FACTION_RULES: ${{ vars.WGC_GATE_FACTION_RULES }}
      WGC_GATE_DETACHMENT_RULES: ${{ vars.WGC_GATE_DETACHMENT_RULES }}
      WGC_GATE_GLOSSARY: ${{ vars.WGC_GATE_GLOSSARY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pipeline
        run: python -m pip install --disable-pip-version-check -e .

      # An unset repository variable arrives as an EMPTY STRING, not as "absent", so the
      # library default never applies here. Two of the five then fail loudly inside load_config
      # and one (WGC_DETAIL_EDITION) would sail through as "" and stamp an empty edition code on
      # every entity. Checked together, up front, so the diagnostic names the variable rather
      # than the symptom.
      - name: Require the build-shaping repository variables
        run: |
          set -euo pipefail
          missing=""
          names="WGC_DETAIL_SOURCE_URL WGC_DETAIL_ACQUISITION_MODE WGC_DETAIL_EDITION"
          names="$names WGC_GATE_FACTION_RULES WGC_GATE_DETACHMENT_RULES WGC_GATE_GLOSSARY"
          for name in $names; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::unset repository variable(s):$missing -- set them with 'gh variable set'" >&2
            exit 1
          fi
          echo "build-shaping variables present"

      # The full run, prerelease channel: acquire -> parse -> normalize -> reconcile -> curate ->
      # validate -> build (contract §1). This never publishes -- there is no publish step in this
      # workflow, and the token above cannot reach Releases or Pages even if there were one.
      # Exit 20 is the "valid candidate, advisory findings attached" outcome (contract §1's
      # exit-code table) — a reviewable candidate, not a failure. Only 0 and 20 proceed to
      # the branch push; 30 (blocking findings) and 40+ (acquisition/infra) still fail here.
      - name: Build the candidate snapshot
        run: |
          set +e
          rules-pipeline build \
            --channel prerelease \
            --rules-version-id "$RULES_VERSION_ID"
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 20 ]; then
            exit "$code"
          fi

      - name: Push the candidate branch
        run: |
          set -euo pipefail
          git config user.name "wargame-rules-data bot"
          git config user.email "noreply@users.noreply.github.com"
          git checkout -B "candidate/$RULES_VERSION_ID"
          git add data reports
          if git diff --cached --quiet; then
            echo "no curated change to push for $RULES_VERSION_ID"
          else
            git commit -m "Candidate $RULES_VERSION_ID"
          fi
          git push --force origin "candidate/$RULES_VERSION_ID"

      # The reviewer view FR-037 asks for: verdict, scale, and every sub-report in the
      # approver's reading order, plus a pointer to the changed-file list (task T119).
      - name: Render the PR body
        run: >-
          python -m tools.render_pr_body
          "reports/$RULES_VERSION_ID/report.json"
          > /tmp/candidate-pr-body.md

      # Opens the PR the first time a candidate is pushed for this version id, or updates the
      # existing one's body so a re-run's PR reflects the latest report -- either way the diff
      # itself (data/, reports/<rulesVersionId>/) is what `git push --force` above already put
      # on the branch; this step only has to point the reviewer at it in the right order.
      - name: Open or update the candidate pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh pr view "candidate/$RULES_VERSION_ID" --json number >/dev/null 2>&1; then
            gh pr edit "candidate/$RULES_VERSION_ID" --body-file /tmp/candidate-pr-body.md
          else
            gh pr create \
              --title "Candidate $RULES_VERSION_ID" \
              --base main \
              --head "candidate/$RULES_VERSION_ID" \
              --body-file /tmp/candidate-pr-body.md
          fi
