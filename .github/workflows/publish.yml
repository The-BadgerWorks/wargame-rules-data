# AI-Assisted: Claude Code (model: claude-opus-5) - Authored the gated publication workflow
# (task T072): workflow_dispatch ONLY, never schedule and never push, running against a GitHub
# Environment with required reviewers, with GITHUB_TOKEN permissions limited to what publication
# needs and no long-lived PAT anywhere (FR-038, FR-046, research D7).
# AI-Assisted: Claude Code (model: claude-sonnet-5) - Consolidated the checksum assertion and
# the re-validation into `rules-pipeline publish` itself (task T116, pipeline/publish/gate.py),
# replacing the inline bash `exit 51` and the separate `validate` step with the one CLI command
# a curator can also run locally against the same checked-out commit (contract §1's "no CI-only
# code path"). This job's own name ("publish") is part of the gate's own refusal to run anywhere
# else (task T118's `in_approved_ci_context`). Also completed the Pages half `docs/repo-
# settings.md` flagged as deferred: the actual `actions/deploy-pages` steps, since
# `pipeline.publish.pages.deploy_pages` only ever wrote a local marker file and nothing had
# called the Pages deployment action since the environment was created (task T117).
name: publish

# `workflow_dispatch` and nothing else. This is the only code path in the repository that can
# write a Release, a release asset, or Pages, so what may trigger it *is* the control:
#
# * no `schedule`, because FR-052 requires that automated runs never publish; and
# * no `push`, because a merge to `main` must not be able to ship a snapshot to players.
#
# `candidate.yml` builds and opens the pull request, and it has no credential that reaches
# Releases or Pages at all. The separation is by capability rather than by policy.
on:
  workflow_dispatch:
    inputs:
      rules_version_id:
        description: The rulesVersionId to publish, e.g. mfm-2026-06
        required: true
        type: string
      commit_sha:
        description: The approved candidate commit. The snapshot is rebuilt from exactly this.
        required: true
        type: string
      expect_sha256:
        description: >-
          The sha256 of the approved bundle. The rebuild must reproduce it byte for byte;
          anything else exits 51, because an approval authorises content, not a rebuild.
        required: true
        type: string
      channel:
        description: Which channel to publish to.
        required: true
        default: prerelease
        type: choice
        options: [prerelease, published]

# One publication per version at a time, and never cancelled mid-flight: an interrupted publish
# is the one case where the ordering guarantees stop protecting us (FR-057).
concurrency:
  group: publish-${{ inputs.rules_version_id }}
  cancel-in-progress: false

# The whole token budget. `contents: write` creates the Release and its asset; `pages: write`
# and `id-token: write` deploy the site. Nothing else is granted, and **no long-lived PAT exists
# anywhere in this design** — the workflow's own GITHUB_TOKEN is the only credential, and
# consumers need none at all (FR-046).
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # The approval gate. The job cannot start until a named reviewer approves in the Actions UI,
    # and GitHub records the approver, the timestamp and the deployment — which is exactly what
    # FR-038 requires and what SC-012 audits. Declining leaves the manifest byte-identical,
    # because this job is the only thing that writes it (FR-040).
    environment: ${{ inputs.channel }}

    env:
      WGC_DATA_CHANNEL: ${{ inputs.channel }}
      # Same keyed digest the candidate build used — the deterministic rebuild must produce
      # byte-identical digests or the checksum assertion below would fail spuriously.
      WGC_MECHANIC_DIGEST_KEY: ${{ secrets.WGC_MECHANIC_DIGEST_KEY }}
      # Same detail-source location the candidate build acquired from, for the byte-identical
      # rebuild the checksum assertion depends on.
      WGC_DETAIL_SOURCE_URL: ${{ vars.WGC_DETAIL_SOURCE_URL }}

    steps:
      - name: Check out the approved commit
        uses: actions/checkout@v4
        with:
          # The approved commit, not the branch head. Publishing "whatever is on main now"
          # would mean the approval covered content that is no longer what ships.
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pipeline
        run: python -m pip install --disable-pip-version-check -e .

      # Produces the artifact `rules-pipeline publish` locates and checks below (contract §4
      # step 2). This is the only network-touching step other than `publish` itself -- both run
      # the real acquire -> ... -> build chain against the checked-out commit, exactly as a
      # curator reproducing this on a laptop would (contract §1's "no CI-only code path").
      - name: Rebuild the snapshot from the approved commit
        run: >-
          rules-pipeline build
          --channel "${{ inputs.channel }}"
          --rules-version-id "${{ inputs.rules_version_id }}"

      # `pipeline.publish.gate.run_publish` (task T116) owns everything from here: it refuses
      # outside this exact job (this workflow's own `name: publish`), refuses a duplicate
      # rulesVersionId before touching anything (FR-041), asserts the rebuild above reproduces
      # `expect_sha256` or exits 51 (FR-039), re-validates and refuses on any blocking finding
      # (exit 30), and only then creates the Release, uploads the asset, re-downloads and
      # verifies it, and regenerates the manifest (FR-045) -- one command instead of four
      # workflow steps, so the same command is what a curator runs locally with `--dry-run`.
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          rules-pipeline publish
          --channel "${{ inputs.channel }}"
          --commit-sha "${{ inputs.commit_sha }}"
          --expect-sha256 "${{ inputs.expect_sha256 }}"

      # The manifest `rules-pipeline publish` just regenerated is on disk in `site/` at this
      # point, whether or not it has been committed to `main` yet -- Pages serves what this
      # workflow uploads as an artifact, per `docs/repo-settings.md`'s "GitHub Actions" Pages
      # source (`build_type: workflow`), not what is on the default branch. Deploying here,
      # after the checksum and validation gates and before the git commit below, means Pages
      # only ever serves a manifest this job already verified.
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: pages_deployment
        uses: actions/deploy-pages@v4

      - name: Empty the workspace
        if: always()
        run: rm -rf work

      - name: Commit the manifest and the checksum ledger
        run: |
          set -euo pipefail
          git config user.name "wargame-rules-data bot"
          git config user.email "noreply@users.noreply.github.com"
          git add site state
          git diff --cached --quiet || git commit -m "Publish ${{ inputs.rules_version_id }} to ${{ inputs.channel }}"
          git push origin HEAD:main
