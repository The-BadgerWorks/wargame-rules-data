# AI-Assisted: Claude Code (model: claude-opus-5) - Authored the gated publication workflow
# (task T072): workflow_dispatch ONLY, never schedule and never push, running against a GitHub
# Environment with required reviewers, with GITHUB_TOKEN permissions limited to what publication
# needs and no long-lived PAT anywhere (FR-038, FR-046, research D7).
name: publish

# `workflow_dispatch` and nothing else. This is the only code path in the repository that can
# write a Release, a release asset, or Pages, so what may trigger it *is* the control:
#
# * no `schedule`, because FR-052 requires that automated runs never publish; and
# * no `push`, because a merge to `main` must not be able to ship a snapshot to players.
#
# `candidate.yml` builds and opens the pull request, and it has no credential that reaches
# Releases or Pages at all. The separation is by capability rather than by policy.
on:
  workflow_dispatch:
    inputs:
      rules_version_id:
        description: The rulesVersionId to publish, e.g. mfm-2026-06
        required: true
        type: string
      commit_sha:
        description: The approved candidate commit. The snapshot is rebuilt from exactly this.
        required: true
        type: string
      expect_sha256:
        description: >-
          The sha256 of the approved bundle. The rebuild must reproduce it byte for byte;
          anything else exits 51, because an approval authorises content, not a rebuild.
        required: true
        type: string
      channel:
        description: Which channel to publish to.
        required: true
        default: prerelease
        type: choice
        options: [prerelease, published]

# One publication per version at a time, and never cancelled mid-flight: an interrupted publish
# is the one case where the ordering guarantees stop protecting us (FR-057).
concurrency:
  group: publish-${{ inputs.rules_version_id }}
  cancel-in-progress: false

# The whole token budget. `contents: write` creates the Release and its asset; `pages: write`
# and `id-token: write` deploy the site. Nothing else is granted, and **no long-lived PAT exists
# anywhere in this design** — the workflow's own GITHUB_TOKEN is the only credential, and
# consumers need none at all (FR-046).
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # The approval gate. The job cannot start until a named reviewer approves in the Actions UI,
    # and GitHub records the approver, the timestamp and the deployment — which is exactly what
    # FR-038 requires and what SC-012 audits. Declining leaves the manifest byte-identical,
    # because this job is the only thing that writes it (FR-040).
    environment: ${{ inputs.channel }}

    env:
      WGC_DATA_CHANNEL: ${{ inputs.channel }}

    steps:
      - name: Check out the approved commit
        uses: actions/checkout@v4
        with:
          # The approved commit, not the branch head. Publishing "whatever is on main now"
          # would mean the approval covered content that is no longer what ships.
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pipeline
        run: python -m pip install --disable-pip-version-check -e .

      - name: Rebuild the snapshot from the approved commit
        run: >-
          rules-pipeline build
          --channel "${{ inputs.channel }}"
          --rules-version-id "${{ inputs.rules_version_id }}"

      # One assertion delivers FR-039 (an approval does not authorise rebuilt content) and
      # FR-033/SC-006 (determinism). A mismatch exits 51 and nothing consumer-visible is touched.
      - name: Assert the rebuild reproduces the approved bundle
        run: |
          set -euo pipefail
          built="$(sha256sum "rules-${{ inputs.rules_version_id }}.json" | cut -d' ' -f1)"
          if [ "$built" != "${{ inputs.expect_sha256 }}" ]; then
            echo "::error::rebuilt bundle ${built} is not the approved ${{ inputs.expect_sha256 }}"
            exit 51
          fi

      - name: Re-run validation
        run: rules-pipeline validate --channel "${{ inputs.channel }}"

      # Steps below are the publication sequence itself: create the release, upload the asset,
      # re-download and verify it, and only then regenerate the manifest and deploy. In that
      # order the manifest never names an artifact that is not already retrievable (FR-045).
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          rules-pipeline publish
          --channel "${{ inputs.channel }}"
          --commit-sha "${{ inputs.commit_sha }}"
          --expect-sha256 "${{ inputs.expect_sha256 }}"

      - name: Empty the workspace
        if: always()
        run: rm -rf work

      - name: Commit the manifest and the checksum ledger
        run: |
          set -euo pipefail
          git config user.name "wargame-rules-data bot"
          git config user.email "noreply@users.noreply.github.com"
          git add site state
          git diff --cached --quiet || git commit -m "Publish ${{ inputs.rules_version_id }} to ${{ inputs.channel }}"
          git push origin HEAD:main
