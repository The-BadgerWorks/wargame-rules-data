# AI-Assisted: Claude Code (model: claude-opus-5) - Authored the gated publication workflow
# (task T072): workflow_dispatch ONLY, never schedule and never push, running against a GitHub
# Environment with required reviewers, with GITHUB_TOKEN permissions limited to what publication
# needs and no long-lived PAT anywhere (FR-038, FR-046, research D7).
# AI-Assisted: Claude Code (model: claude-sonnet-5) - Consolidated the checksum assertion and
# the re-validation into `rules-pipeline publish` itself (task T116, pipeline/publish/gate.py),
# replacing the inline bash `exit 51` and the separate `validate` step with the one CLI command
# a curator can also run locally against the same checked-out commit (contract §1's "no CI-only
# code path"). This job's own name ("publish") is part of the gate's own refusal to run anywhere
# else (task T118's `in_approved_ci_context`). Also completed the Pages half `docs/repo-
# settings.md` flagged as deferred: the actual `actions/deploy-pages` steps, since
# `pipeline.publish.pages.deploy_pages` only ever wrote a local marker file and nothing had
# called the Pages deployment action since the environment was created (task T117).
# AI-Assisted: Claude Code (model: claude-sonnet-5) - Added the rebuild-notification step to the
# rules-reference site and its log-scrape check (003-rules-reference-web T043/T045,
# contracts/rebuild-notification.md §1.5, §3), per the frozen contract with WargameCompanion's
# 003 spec. Non-interference with publication is by construction: `if: success()`,
# `continue-on-error: true`, and the `|| echo` fallback keep a failed, refused, timed-out, or
# unconfigured notification from ever failing this job or altering its outcome.
# AI-Assisted: Claude Code (model: claude-opus-5) - Bound the rebuild's publication date to the
# approved commit's own recorded report (`--published-at-from-report`), after run 31657300051
# refused `wh40k-11e-2026-08-2` with exit 51 on a bundle whose only difference from the approved
# one was `snapshotMeta.publishedAt` — the dispatch day, because `published_at` had never been
# reachable from the CLI (FR-033, FR-039).
name: publish

# `workflow_dispatch` and nothing else. This is the only code path in the repository that can
# write a Release, a release asset, or Pages, so what may trigger it *is* the control:
#
# * no `schedule`, because FR-052 requires that automated runs never publish; and
# * no `push`, because a merge to `main` must not be able to ship a snapshot to players.
#
# `candidate.yml` builds and opens the pull request, and it has no credential that reaches
# Releases or Pages at all. The separation is by capability rather than by policy.
on:
  workflow_dispatch:
    inputs:
      rules_version_id:
        description: The rulesVersionId to publish, e.g. mfm-2026-06
        required: true
        type: string
      commit_sha:
        description: The approved candidate commit. The snapshot is rebuilt from exactly this.
        required: true
        type: string
      expect_sha256:
        description: >-
          The sha256 of the approved bundle. The rebuild must reproduce it byte for byte;
          anything else exits 51, because an approval authorises content, not a rebuild.
        required: true
        type: string
      channel:
        description: Which channel to publish to.
        required: true
        default: prerelease
        type: choice
        options: [prerelease, published]

# One publication per version at a time, and never cancelled mid-flight: an interrupted publish
# is the one case where the ordering guarantees stop protecting us (FR-057).
concurrency:
  group: publish-${{ inputs.rules_version_id }}
  cancel-in-progress: false

# The whole token budget. `contents: write` creates the Release and its asset; `pages: write`
# and `id-token: write` deploy the site. Nothing else is granted, and **no long-lived PAT exists
# anywhere in this design** — the workflow's own GITHUB_TOKEN is the only credential, and
# consumers need none at all (FR-046).
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # The approval gate. The job cannot start until a named reviewer approves in the Actions UI,
    # and GitHub records the approver, the timestamp and the deployment — which is exactly what
    # FR-038 requires and what SC-012 audits. Declining leaves the manifest byte-identical,
    # because this job is the only thing that writes it (FR-040).
    environment: ${{ inputs.channel }}

    env:
      WGC_DATA_CHANNEL: ${{ inputs.channel }}
      # Same keyed digest the candidate build used — the deterministic rebuild must produce
      # byte-identical digests or the checksum assertion below would fail spuriously.
      WGC_MECHANIC_DIGEST_KEY: ${{ secrets.WGC_MECHANIC_DIGEST_KEY }}
      # Same detail-source location the candidate build acquired from, for the byte-identical
      # rebuild the checksum assertion depends on.
      WGC_DETAIL_SOURCE_URL: ${{ vars.WGC_DETAIL_SOURCE_URL }}
      # The build-shaping variables the byte-identical rebuild depends on, all repository
      # variables for the same reason WGC_DETAIL_SOURCE_URL is one: they describe *this data
      # set's* current release posture, not the pipeline's behaviour, and a curator must be able
      # to change them without a workflow edit. They are deliberately NOT library defaults --
      # a default reaches every fixture build in the test suite, where an un-curated fixture is
      # the expected state and a switched-on gate would block it.
      #
      # WGC_DETAIL_ACQUISITION_MODE / WGC_DETAIL_EDITION: html + wh40k-11e is the wholesale
      # adoption the O1 Ruling requires (004 T074). Absent these, a CI rebuild would acquire in
      # csv mode against wh40k-10e and could not reproduce a candidate built in html mode.
      # WGC_GATE_*: on, the three campaigns having completed (004 T050, T057, T064).
      WGC_DETAIL_ACQUISITION_MODE: ${{ vars.WGC_DETAIL_ACQUISITION_MODE }}
      WGC_DETAIL_EDITION: ${{ vars.WGC_DETAIL_EDITION }}
      WGC_GATE_FACTION_RULES: ${{ vars.WGC_GATE_FACTION_RULES }}
      WGC_GATE_DETACHMENT_RULES: ${{ vars.WGC_GATE_DETACHMENT_RULES }}
      WGC_GATE_GLOSSARY: ${{ vars.WGC_GATE_GLOSSARY }}

    steps:
      - name: Check out the approved commit
        uses: actions/checkout@v4
        with:
          # The approved commit, not the branch head. Publishing "whatever is on main now"
          # would mean the approval covered content that is no longer what ships.
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          # The manifest/ledger commit at the end of this job pushes to protected main. The
          # default GITHUB_TOKEN cannot bypass branch protection on this org, so the push
          # authenticates as the maintainer via a fine-grained PAT (Contents: read-write,
          # this repository only) — the documented write-capable exception beside the
          # read-only WGC_SETTINGS_AUDIT_TOKEN. Falls back to the default token when unset.
          token: ${{ secrets.WGC_PUBLISH_PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pipeline
        run: python -m pip install --disable-pip-version-check -e .

      # An unset repository variable arrives as an EMPTY STRING, not as "absent", so the
      # library default never applies here. Two of the five then fail loudly inside load_config
      # and one (WGC_DETAIL_EDITION) would sail through as "" and stamp an empty edition code on
      # every entity. Checked together, up front, so the diagnostic names the variable rather
      # than the symptom.
      - name: Require the build-shaping repository variables
        run: |
          set -euo pipefail
          missing=""
          names="WGC_DETAIL_SOURCE_URL WGC_DETAIL_ACQUISITION_MODE WGC_DETAIL_EDITION"
          names="$names WGC_GATE_FACTION_RULES WGC_GATE_DETACHMENT_RULES WGC_GATE_GLOSSARY"
          for name in $names; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::unset repository variable(s):$missing -- set them with 'gh variable set'" >&2
            exit 1
          fi
          echo "build-shaping variables present"

      # Produces the artifact `rules-pipeline publish` locates and checks below (contract §4
      # step 2). This is the only network-touching step other than `publish` itself -- both run
      # the real acquire -> ... -> build chain against the checked-out commit, exactly as a
      # curator reproducing this on a laptop would (contract §1's "no CI-only code path").
      # Exit 20 (valid with advisory findings) is a publishable rebuild — the gate below
      # re-validates and refuses blocking findings itself. Only 0 and 20 proceed.
      #
      # `--published-at-from-report` is what makes the checksum assertion below survive a
      # calendar day. `snapshotMeta.publishedAt` is the one timestamp in the bundle
      # (curated-snapshot-format.md §6), so a rebuild that stamped its own UTC day produced a
      # bundle differing from the approved one in exactly that field and exit 51'd — which is
      # what happened to `wh40k-11e-2026-08-2`, approved on the 12th and dispatched on the 13th.
      #
      # The date is read from THIS CHECKOUT's `reports/<id>/report.json`, which `candidate.yml`
      # committed beside `data/` when it built the candidate. That is deliberate, and it is why
      # this is not a fifth `workflow_dispatch` input: the published date has to be a property
      # of the approved commit, not of the dispatch. A typed input could disagree with what was
      # approved, and the gate below — which reads `publishedAt` back out of this very rebuild —
      # would have no way to notice. A missing or unreadable record exits 60 here rather than
      # falling back to the clock, because a silent fallback is the defect this replaced.
      - name: Rebuild the snapshot from the approved commit
        run: |
          set +e
          rules-pipeline build \
            --channel "${{ inputs.channel }}" \
            --rules-version-id "${{ inputs.rules_version_id }}" \
            --published-at-from-report
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 20 ]; then
            exit "$code"
          fi

      # `pipeline.publish.gate.run_publish` (task T116) owns everything from here: it refuses
      # outside this exact job (this workflow's own `name: publish`), refuses a duplicate
      # rulesVersionId before touching anything (FR-041), asserts the rebuild above reproduces
      # `expect_sha256` or exits 51 (FR-039), re-validates and refuses on any blocking finding
      # (exit 30), and only then creates the Release, uploads the asset, re-downloads and
      # verifies it, and regenerates the manifest (FR-045) -- one command instead of four
      # workflow steps, so the same command is what a curator runs locally with `--dry-run`.
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          rules-pipeline publish
          --channel "${{ inputs.channel }}"
          --commit-sha "${{ inputs.commit_sha }}"
          --expect-sha256 "${{ inputs.expect_sha256 }}"

      # The manifest `rules-pipeline publish` just regenerated is on disk in `site/` at this
      # point, whether or not it has been committed to `main` yet -- Pages serves what this
      # workflow uploads as an artifact, per `docs/repo-settings.md`'s "GitHub Actions" Pages
      # source (`build_type: workflow`), not what is on the default branch. Deploying here,
      # after the checksum and validation gates and before the git commit below, means Pages
      # only ever serves a manifest this job already verified.
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: pages_deployment
        uses: actions/deploy-pages@v4

      # contracts/rebuild-notification.md §3: appended after the Pages deploy step above and
      # before the bookkeeping commit below, so it runs after every gate this job enforces
      # (checksum assertion and re-validation inside `rules-pipeline publish`, Release upload
      # and verification, manifest regeneration, Pages deploy) and cannot influence any of them.
      # `if: success()` places it strictly downstream of all of those; `continue-on-error: true`
      # plus the `|| echo` fallback make a failed, refused, timed-out, or unconfigured
      # notification unable to fail this job, block publication, or alter any consumer-visible
      # artifact (contract §1.2). Never runs for `prerelease` (contract §1.4). Output is
      # captured to a file so the log-scrape check after bookkeeping below (contract §1.5,
      # T045) can assert the secret never appears in it -- the same second, independent check
      # `detect.yml`/`integrity.yml` already apply to `WGC_NOTIFY_WEBHOOK_URL`.
      - name: Notify the rules-reference site to rebuild
        if: ${{ success() && inputs.channel == 'published' }}
        continue-on-error: true
        env:
          WGC_REBUILD_HOOK_URL: ${{ secrets.WGC_REBUILD_HOOK_URL }}
        run: |
          if [ -z "${WGC_REBUILD_HOOK_URL:-}" ]; then
            echo "rebuild hook not configured; skipping (documented no-op)"
            exit 0
          fi
          {
            curl -fsS -m 10 -o /dev/null -X POST "$WGC_REBUILD_HOOK_URL" \
              || echo "rebuild notification failed; the site's manifest watch will recover this"
          } 2>&1 | tee rebuild-notify.log

      - name: Empty the workspace
        if: always()
        run: rm -rf work

      # The job runs from the approved commit, which may be behind main by the time the
      # publish completes — so the bookkeeping commit is made on the detached HEAD and then
      # replayed onto the CURRENT main tip before pushing. A cherry-pick conflict here means
      # main's site/state changed since approval (e.g. a concurrent publish) — failing is
      # correct in that case, not something to force past.
      - name: Commit the manifest and the checksum ledger
        run: |
          set -euo pipefail
          git config user.name "wargame-rules-data bot"
          git config user.email "noreply@users.noreply.github.com"
          git add site state
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Publish ${{ inputs.rules_version_id }} to ${{ inputs.channel }}"
          bookkeeping=$(git rev-parse HEAD)
          git fetch origin main
          git checkout --detach origin/main
          git cherry-pick "$bookkeeping"
          git push origin HEAD:main

      # T045 (contract §1.5): the same second, independent check `detect.yml`/`integrity.yml`
      # already run for `WGC_NOTIFY_WEBHOOK_URL`, extended to `WGC_REBUILD_HOOK_URL`.
      # Deliberately placed after bookkeeping rather than immediately after the notify step
      # above, so a false positive here can never withhold the manifest/ledger commit the
      # notify step's own contract-mandated placement (§3) is required to precede.
      - name: Assert the rebuild-hook secret never appears in this job's own output
        if: always() && env.WGC_REBUILD_HOOK_URL != ''
        env:
          WGC_REBUILD_HOOK_URL: ${{ secrets.WGC_REBUILD_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -f rebuild-notify.log ] && grep -qF "$WGC_REBUILD_HOOK_URL" rebuild-notify.log; then
            echo "::error::the rebuild hook secret appeared in this job's own output"
            exit 1
          fi
