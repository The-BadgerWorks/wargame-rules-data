# AI-Assisted: Claude Code (model: claude-sonnet-5) - Authored the scheduled detection workflow
# (task T108): schedule at 09:00/21:00 UTC plus workflow_dispatch, writing only
# state/detection-digest.json and the ledger, invoking candidate.yml on exit 10, notifying on a
# raised candidate, and alerting on a detector fault or the staleness alarm (FR-051, FR-052,
# FR-055, research D4c).
name: detect

# `schedule` plus `workflow_dispatch` -- and nothing else. FR-051 wants this to run twice daily
# unattended; FR-052 wants it to never be able to publish. Both hold by construction: this
# workflow's only permission is `contents: write` over `state/`, and it never checks out or
# dispatches anything that could reach Releases or Pages.
on:
  schedule:
    # research D4c: two checks a day survive one transient failure without breaching SC-004's
    # 24h detection target. The cadence is documented here and in
    # `contracts/pipeline-run-interface.md` Â§5 (`WGC_DETECT_CRON`); changing one without the
    # other is a drift this comment exists to prevent.
    - cron: "0 9,21 * * *"
  workflow_dispatch: {}

# One detection sweep in flight at a time. Never cancelled mid-flight: an interrupted sweep
# would leave `state/detection-digest.json` and the ledger out of step with each other.
concurrency:
  group: detect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.detect.outputs.exit_code }}
      stale: ${{ steps.detect.outputs.stale }}
      rules_version_id: ${{ steps.version.outputs.rules_version_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This job commits state updates to protected main; same push-auth rationale as
          # publish.yml -- maintainer PAT, falling back to the default token when unset.
          token: ${{ secrets.WGC_PUBLISH_PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pipeline
        run: python -m pip install --disable-pip-version-check -e .

      # `rules-pipeline detect` sweeps the points source, digests it, and compares against
      # `state/detection-digest.json`. Its exit code IS the contract (`pipeline-run-interface.md`
      # Â§2): 0 no change, 10 a mechanical change, 40 unreachable, 41 restructured. `set +e`
      # because a non-zero exit here is expected data, not a step failure -- the job decides what
      # each code means in the steps below, not the runner. Output is captured so the staleness
      # alarm (FR-055), which `rules-pipeline detect` prints on stderr on every run whether or
      # not this sweep itself succeeded, can be read back exactly rather than re-derived here.
      - name: Detect
        id: detect
        run: |
          set +e
          rules-pipeline detect --channel published 2>&1 | tee detect.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if grep -q "STALE detection" detect.log; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Compute the candidate rules version id
        id: version
        if: steps.detect.outputs.exit_code == '10'
        # research D9: `mfm-YYYY-MM` from the calendar month of the detected release. A second
        # release in one month takes a `-b`/`-c` suffix, decided by the curator when the
        # candidate is reviewed -- not derivable here, and not needed for the candidate branch
        # name to be unique per detection.
        run: echo "rules_version_id=mfm-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # `detect`'s only writes are `state/detection-digest.json` (only on a successful sweep,
      # exit 0 or 10) and one line appended to `state/run-ledger.jsonl` (every sweep, including a
      # failed one) -- never `data/`, never `curation/`, never a report (contract Â§3).
      - name: Commit the detection state and ledger
        run: |
          set -euo pipefail
          git config user.name "wargame-rules-data bot"
          git config user.email "noreply@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Detection check $(date -u +%Y-%m-%dT%H:%M:%SZ) (exit ${{ steps.detect.outputs.exit_code }})"
          git push origin HEAD:main

      - name: Notify on a raised candidate
        if: steps.detect.outputs.exit_code == '10'
        env:
          WGC_NOTIFY_WEBHOOK_URL: ${{ secrets.WGC_NOTIFY_WEBHOOK_URL }}
        run: |
          python -m pipeline.observability.notify \
            --title "Points release detected" \
            --message "rules-pipeline detect found a mechanical change; candidate ${{ steps.version.outputs.rules_version_id }} is being built." \
            2>&1 | tee notify.log

      - name: Alert on a detector fault
        if: steps.detect.outputs.exit_code == '40' || steps.detect.outputs.exit_code == '41'
        env:
          WGC_NOTIFY_WEBHOOK_URL: ${{ secrets.WGC_NOTIFY_WEBHOOK_URL }}
        run: |
          python -m pipeline.observability.notify \
            --title "Detection failed" \
            --message "rules-pipeline detect exited ${{ steps.detect.outputs.exit_code }}; the previously published version stays current." \
            2>&1 | tee -a notify.log

      - name: Alert on the staleness alarm
        if: steps.detect.outputs.stale == 'true'
        env:
          WGC_NOTIFY_WEBHOOK_URL: ${{ secrets.WGC_NOTIFY_WEBHOOK_URL }}
        run: |
          python -m pipeline.observability.notify \
            --title "Detection is stale" \
            --message "no successful detection check has completed within the configured staleness window (FR-055)." \
            2>&1 | tee -a notify.log

      # Task T107's second, independent check: even though GitHub already masks a registered
      # secret in the raw log view, this asserts the literal value never appeared in what this
      # job's own notification step produced.
      - name: Assert the webhook secret never appears in this job's own output
        if: always() && env.WGC_NOTIFY_WEBHOOK_URL != ''
        env:
          WGC_NOTIFY_WEBHOOK_URL: ${{ secrets.WGC_NOTIFY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -f notify.log ] && grep -qF "$WGC_NOTIFY_WEBHOOK_URL" notify.log; then
            echo "::error::the notification webhook secret appeared in this job's own output"
            exit 1
          fi

      - name: Fail the job on a detector fault
        if: steps.detect.outputs.exit_code == '40' || steps.detect.outputs.exit_code == '41'
        run: |
          echo "::error::rules-pipeline detect exited ${{ steps.detect.outputs.exit_code }}; see the job log above"
          exit 1

  candidate:
    needs: detect
    if: needs.detect.outputs.exit_code == '10'
    uses: ./.github/workflows/candidate.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      rules_version_id: ${{ needs.detect.outputs.rules_version_id }}
