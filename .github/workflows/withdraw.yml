# AI-Assisted: Claude Code (model: claude-sonnet-5) - Authored the withdrawal workflow
# (task T142): workflow_dispatch only, environment-gated like publish.yml but deliberately not
# part of the publish job -- manifest-only, no rebuild, no source access, so a defective release
# is neutralised in under a minute under pressure (FR-044, SC-009, research D7).
# AI-Assisted: Claude Code (model: claude-sonnet-5) - Added the rebuild-notification step to the
# rules-reference site and its log-scrape check (003-rules-reference-web T043/T045,
# contracts/rebuild-notification.md §1.5, §3), per the frozen contract with WargameCompanion's
# 003 spec. Non-interference with withdrawal is by construction: `if: success()`,
# `continue-on-error: true`, and the `|| echo` fallback keep a failed, refused, timed-out, or
# unconfigured notification from ever failing this job or altering its outcome.
name: withdraw

# `workflow_dispatch` and nothing else -- the same reasoning as `publish.yml`'s own `on:` (FR-038
# extends to withdrawal too: nothing schedules or pushes its way into editing a live manifest).
on:
  workflow_dispatch:
    inputs:
      rules_version_id:
        description: The already-published rulesVersionId to withdraw.
        required: true
        type: string
      reason:
        description: Short factual reason, shown to a player pinned to this version (FR-044).
        required: true
        type: string
      channel:
        description: Which channel's manifest carries the version being withdrawn.
        required: true
        default: prerelease
        type: choice
        options: [prerelease, published]

# One withdrawal per version at a time, and never cancelled mid-flight, for the same reason
# `publish.yml` never is: an interrupted manifest write is the one case the ordering guarantees
# in `pipeline.build.manifest.withdraw_entry` stop protecting us from (FR-057).
concurrency:
  group: withdraw-${{ inputs.rules_version_id }}
  cancel-in-progress: false

# The same token budget as `publish.yml`, and for the same reason -- `withdraw` is the other code
# path (besides `publish`) that may ever write `site/`. No long-lived PAT anywhere (FR-046).
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  withdraw:
    runs-on: ubuntu-latest

    # The approval gate. `withdraw.yml` is deliberately its own job rather than a step of
    # `publish.yml` (contract §4's "deliberately not part of the publish job"), but the control
    # is identical: the job cannot start until a named reviewer approves in the Actions UI, and
    # that has nothing to rebuild or re-acquire waiting behind it -- which is what keeps
    # withdrawal fast under pressure once approved (SC-009).
    environment: ${{ inputs.channel }}

    env:
      WGC_DATA_CHANNEL: ${{ inputs.channel }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Withdrawal edits site/manifest.json on protected main; same push-auth rationale
          # as publish.yml — maintainer PAT with Contents read-write on this repo only.
          token: ${{ secrets.WGC_PUBLISH_PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pipeline
        run: python -m pip install --disable-pip-version-check -e .

      # `pipeline.publish.withdraw.run_withdraw` (task T141) owns everything: it refuses outside
      # this exact job (this workflow's own `name: withdraw`), refuses an unlisted
      # `rulesVersionId` or a blank reason, and otherwise only flips `withdrawn`/`withdrawnReason`
      # on one manifest entry -- no rebuild, no acquisition, no touch of `data/` or `curation/`.
      - name: Withdraw
        run: >-
          rules-pipeline withdraw
          --channel "${{ inputs.channel }}"
          --rules-version-id "${{ inputs.rules_version_id }}"
          --reason "${{ inputs.reason }}"

      # Same reasoning as `publish.yml`'s equivalent step: the manifest `rules-pipeline withdraw`
      # just rewrote is on disk in `site/` here, whether or not it is committed to `main` yet, and
      # Pages serves what this workflow uploads as an artifact.
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # contracts/rebuild-notification.md §3: appended after the Pages deploy step above and
      # before the bookkeeping commit below, so it runs after every gate this job enforces
      # (the refusal checks inside `rules-pipeline withdraw`, manifest rewrite, Pages deploy)
      # and cannot influence any of them. `if: success()` places it strictly downstream of all
      # of those; `continue-on-error: true` plus the `|| echo` fallback make a failed, refused,
      # timed-out, or unconfigured notification unable to fail this job, block withdrawal, or
      # alter any consumer-visible artifact (contract §1.2). Never runs for `prerelease`
      # (contract §1.4). Output is captured to a file so the log-scrape check after bookkeeping
      # below (contract §1.5, T045) can assert the secret never appears in it -- the same
      # second, independent check `detect.yml`/`integrity.yml` already apply to
      # `WGC_NOTIFY_WEBHOOK_URL`.
      - name: Notify the rules-reference site to rebuild
        if: ${{ success() && inputs.channel == 'published' }}
        continue-on-error: true
        env:
          WGC_REBUILD_HOOK_URL: ${{ secrets.WGC_REBUILD_HOOK_URL }}
        run: |
          if [ -z "${WGC_REBUILD_HOOK_URL:-}" ]; then
            echo "rebuild hook not configured; skipping (documented no-op)"
            exit 0
          fi
          {
            curl -fsS -m 10 -o /dev/null -X POST "$WGC_REBUILD_HOOK_URL" \
              || echo "rebuild notification failed; the site's manifest watch will recover this"
          } 2>&1 | tee rebuild-notify.log

      - name: Commit the manifest
        run: |
          set -euo pipefail
          git config user.name "wargame-rules-data bot"
          git config user.email "noreply@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "Withdraw ${{ inputs.rules_version_id }} from ${{ inputs.channel }}: ${{ inputs.reason }}"
          git push origin HEAD:main

      # T045 (contract §1.5): the same second, independent check `detect.yml`/`integrity.yml`
      # already run for `WGC_NOTIFY_WEBHOOK_URL`, extended to `WGC_REBUILD_HOOK_URL`.
      # Deliberately placed after bookkeeping rather than immediately after the notify step
      # above, so a false positive here can never withhold the manifest commit the notify
      # step's own contract-mandated placement (§3) is required to precede.
      - name: Assert the rebuild-hook secret never appears in this job's own output
        if: always() && env.WGC_REBUILD_HOOK_URL != ''
        env:
          WGC_REBUILD_HOOK_URL: ${{ secrets.WGC_REBUILD_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -f rebuild-notify.log ] && grep -qF "$WGC_REBUILD_HOOK_URL" rebuild-notify.log; then
            echo "::error::the rebuild hook secret appeared in this job's own output"
            exit 1
          fi
